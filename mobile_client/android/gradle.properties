org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows workaround: Kotlin incremental compilation fails when a plugin's Kotlin sources
# (in the pub cache, e.g. on C:) and this project (e.g. on D:) are on different drives:
# "Could not close incremental caches ... this and base files have different roots".
# Non-incremental Kotlin compilation avoids it; for this project it costs only seconds.
kotlin.incremental=false
